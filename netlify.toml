[build]
  # `npm ci` (not `npm install`) enforces package-lock.json strictly and fails
  # the build on any lockfile drift, instead of silently resolving a different
  # dependency tree than was tested. Part of the post-2026-05-31 outage-
  # prevention hardening.
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  # Pin the Node major so builds don't silently move when Netlify changes its
  # default. "22" tracks the latest 22.x (active LTS) — matches local dev
  # (v22.17.0) and the Node line the working deploys already build on. Bump
  # deliberately, never by surprise.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Phase H.4 — daily SMS cron. Schedule is also declared inside
# netlify/functions/daily-notifications.mts via `export const config`;
# this entry mirrors it so it remains visible in the deployment config.
[functions."daily-notifications"]
  schedule = "0 21 * * *"

# Keep-warm heartbeat — pings a dynamic portal route every 5 min so the
# SSR Lambda stays warm and the "first click after idle" cold start (~3.5s)
# goes away. Schedule mirrors netlify/functions/keep-warm.mts.
[functions."keep-warm"]
  schedule = "*/5 * * * *"

# Weekly payroll auto-draft — drafts the week's employee pay run Monday morning
# (NZ) for review. Draft only; never approves or pays. Schedule mirrors
# netlify/functions/weekly-payroll.mts.
[functions."weekly-payroll"]
  schedule = "0 21 * * 0"

# Campaign drip — sender warm-up. Runs HOURLY: sends each active campaign's next
# batch once its per-campaign send time (NZ) has passed that day. At most one
# batch per NZ day per campaign (guarded by last_batch_at); hourly cadence is
# what lets a send time like 12:45pm actually fire. Schedule mirrors
# netlify/functions/campaign-drip.mts.
[functions."campaign-drip"]
  schedule = "0 * * * *"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Phase H.4 — daily SMS cron. Schedule is also declared inside
# netlify/functions/daily-notifications.mts via `export const config`;
# this entry mirrors it so it remains visible in the deployment config.
[functions."daily-notifications"]
  schedule = "0 21 * * *"

# Keep-warm heartbeat — pings a dynamic portal route every 5 min so the
# SSR Lambda stays warm and the "first click after idle" cold start (~3.5s)
# goes away. Schedule mirrors netlify/functions/keep-warm.mts.
[functions."keep-warm"]
  schedule = "*/5 * * * *"
